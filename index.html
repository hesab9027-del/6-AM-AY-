<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanki — İlk Dəfə</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
:root{--bg:#150f1d;--ink:#fff3e8;--dim:rgba(255,243,232,.28);--rose:#ff7d93;--peach:#ffcfa3;
  --f:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden}
.bg{position:fixed;inset:0;background:url(images/cover.jpg) center/cover;filter:blur(70px) saturate(1.5) brightness(.55);transform:scale(1.4)}
.bg::after{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,transparent,rgba(21,15,29,.85))}

/* ---------- photo frames ---------- */
.frames{position:fixed;inset:0;pointer-events:none}
.frame{position:absolute;width:clamp(120px,15vw,210px);aspect-ratio:4/5;padding:8px 8px 30px;background:#fff3e8;
  border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.45);opacity:.55;transform:rotate(var(--r)) scale(.94);
  transition:opacity .8s,transform .8s;animation:drift 9s ease-in-out infinite alternate;animation-delay:var(--d)}
.frame.lit{opacity:1;transform:rotate(var(--r)) scale(1.04)}
.frame .ph{position:relative;width:100%;height:100%;background:linear-gradient(135deg,#e9c9b6,#c8a6c9);display:grid;place-items:center;
  font-size:12px;color:#5a4260;text-align:center;overflow:hidden}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes drift{to{translate:0 -14px}}
.f1{left:4%;top:8%;--r:-6deg;--d:0s}  .f2{right:5%;top:6%;--r:5deg;--d:-2s}
.f3{left:9%;top:42%;--r:4deg;--d:-4s} .f4{right:10%;top:40%;--r:-4deg;--d:-1s}
.f5{left:5%;bottom:14%;--r:-3deg;--d:-3s} .f6{right:6%;bottom:13%;--r:6deg;--d:-5s}

/* ---------- lyrics ---------- */
#lyrics{position:fixed;left:50%;translate:-50% 0;width:min(680px,88vw);top:0;bottom:120px;overflow-y:auto;
  scrollbar-width:none;padding:38vh 0 40vh;scroll-behavior:smooth;
  mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent)}
#lyrics::-webkit-scrollbar{display:none}
.sec{font-size:14px;color:var(--peach);margin:44px 0 10px;opacity:.7}
.line{font-size:clamp(26px,4.4vw,44px);font-weight:800;line-height:1.18;letter-spacing:-.02em;margin:10px 0;cursor:pointer;
  opacity:.5;filter:blur(1.5px);transform-origin:left center;transform:scale(.92);transition:opacity .4s,filter .4s,transform .4s}
.line.on{opacity:1;filter:none;transform:scale(1)}
.line.past{opacity:.38}
.w{color:var(--ink);transition:text-shadow .4s}
.line.on .w{color:#fff;text-shadow:0 0 22px var(--rose),0 0 4px rgba(255,125,147,.8)}

/* ---------- player bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:18px;background:linear-gradient(transparent,rgba(21,15,29,.92) 40%)}
.meta{display:flex;align-items:center;gap:12px;min-width:0;flex:0 0 220px}
.meta img{width:52px;height:52px;border-radius:6px;object-fit:cover}
.meta b{display:block;font-size:15px}.meta span{font-size:13px;opacity:.65}
.mid{flex:1;display:flex;align-items:center;gap:12px}
#play{width:48px;height:48px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:18px;cursor:pointer}
#play:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
input[type=range]{flex:1;accent-color:var(--rose);height:6px}
time{font-size:13px;opacity:.7;font-variant-numeric:tabular-nums;width:38px}
.tools{display:flex;gap:8px;flex:0 0 auto}
.tools button{background:rgba(255,243,232,.12);color:var(--ink);border:1px solid rgba(255,243,232,.25);border-radius:99px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
#syncHint{position:fixed;top:18px;left:50%;translate:-50% 0;background:var(--rose);color:#2a0f18;padding:10px 18px;border-radius:99px;font-weight:800;display:none;z-index:5}
@media(max-width:760px){.meta{display:none}.frame{opacity:.28;width:96px}.frame.lit{opacity:.7}.tools button{padding:8px 10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#lyrics{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="bg"></div>

<!-- PHOTO FRAMES: put your pictures in the "images" folder named photo1.jpg … photo6.jpg -->
<div class="frames">
  <div class="frame f1"><div class="ph">images/photo1.jpg<img src="photo1.jpg" alt="" onerror="this.remove()"></div></div>
  <div class="frame f2"><div class="ph">images/photo2.jpg<img src="photo2.jpg" alt="" onerror="this.remove()"></div></div>
  <div class="frame f3"><div class="ph">images/photo3.jpg<img src="photo3.jpg" alt="" onerror="this.remove()"></div></div>
  <div class="frame f4"><div class="ph">images/photo4.jpg<img src="photo4.jpg" alt="" onerror="this.remove()"></div></div>
  <div class="frame f5"><div class="ph">images/photo5.jpg<img src="photo5.jpg" alt="" onerror="this.remove()"></div></div>
  <div class="frame f6"><div class="ph">images/photo6.jpg<img src="photo6.jpg" alt="" onerror="this.remove()"></div></div>
</div>

<div id="lyrics" aria-live="polite"></div>

<div class="bar">
  <div class="meta"><img src="images/cover.jpg" alt=""><div><b>İlk Dəfə</b><span>Sanki</span></div></div>
  <div class="mid">
    <button id="play" aria-label="Play">▶</button>
    <time id="cur">0:00</time>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
    <time id="dur">0:00</time>
  </div>
</div>

<audio id="au" src="song.mp3" preload="auto"></audio>

<script>
/* ---------------- LYRICS ---------------- */
const SONG=[
["Verse 1",["Səhər altı, səhər oyandım,","Şirin yuxuların içindən ayıldım.","Telefonu alıram yenə əlimə,","İlk yazdığım ad yenə səninki, bilirsən.","Evdən çıxıb gedirəm evimə,","Sevdiyimin olduğu o yerə.","Tələsirəm, çatımm tez yanına,","Həsrət qalıb sənin gözlərinə."]],
["Pre-Chorus",["Oturub gözləyirəm,","İşıq gələnə kimi.","Uzaqdan bir parıltı görürəm,","Bildim ki, canım gəlib."]],
["Chorus",["Sanki aylar, illər keçib,","Sanki ilk dəfə görmüşəm səni.","Sanki dənizdə boğulanda,","Əlini uzadan həmin insansan sən.","Min göz arasından tək sənsən,","Şirin yuxuda gördüyüm mənzərəsən.","Qarşımda dayanıb gülürsən mənə,","Sanki bütün dünya sığır bu anın içinə.","Sevir, sevir, o məni sevir,","Mən də onu sevirəm.","Hər dəfə gözlərinə baxanda,","Yenidən ona vuruluram."]],
["Continuation",["Sanki zaman dayanır yanımda,","Heç nə qalmır bu dünyanın yadımda.","Bir təbəssümün bəs edir mənə,","Bütün dərdlər unudulur bir anda.","Nə qədər baxsam da, doymuram sənə,","Hər gün yenidən vuruluram gözlərinə.","Bəlkə də yuxudur, oyanmaq istəmirəm,","Sən yanımda olanda başqa heç nə istəmirəm."]]
];
/* ===== EDIT TIMES HERE =====
   Numbers are in seconds. First number = when line 1 appears. Every next number = how long the line before it stays.
   Example: [17.5, 4, 3.5] -> line 1 at 17.5s, line 2 at 21.5s, line 3 at 25s.
   Lines after your last number are not highlighted. */
const MANUAL_TIMES=[17.5,4,3.8,3.9,3.5,2.7,1.7,1.8,2.2,1.9,1.6,2,1.6,2.1,2.3,2,2.4,1.8,2,2.1,2.5,2.7,1.8,1.7,1.9,2,2.3,1.9,1.8,1.9,2.2,2];

const au=document.getElementById('au'), box=document.getElementById('lyrics');
const L=[]; // {start,end,words:[{el,s,e}],el}
SONG.forEach(([name,lines],si)=>{
  const h=document.createElement('div');h.className='sec';h.textContent=name;box.appendChild(h);
  lines.forEach((t,i)=>{
    const el=document.createElement('div');el.className='line';
    const words=t.split(' ').map(w=>{const s=document.createElement('span');s.className='w';s.textContent=w;el.append(s,' ');return{el:s,len:w.length+1}});
    el.onclick=()=>{au.currentTime=L[idx(el)].start;au.play()};
    box.appendChild(el);
    L.push({el,words,w:t.length+(i===0&&si?18:0),start:0,end:0,sec:si});
  });
});
const idx=el=>L.findIndex(l=>l.el===el);

let _t=0;L.forEach((l,i)=>{const d=MANUAL_TIMES[i];if(d===undefined){l.start=Infinity}else{_t+=d;l.start=_t}});

/* ---------------- RENDER LOOP ---------------- */
const frames=[...document.querySelectorAll('.frame')];
let cur=-1;
function tick(){
  const t=au.currentTime;
  let n=-1;for(let i=0;i<L.length;i++){if(t>=L[i].start-0.05)n=i;else break}
  if(n!==cur){
    cur=n;
    L.forEach((l,i)=>{l.el.classList.toggle('on',i===n);l.el.classList.toggle('past',i<n)});
    if(n>=0){const el=L[n].el;box.scrollTo({top:el.offsetTop-box.clientHeight*.38,behavior:'smooth'});
      frames.forEach((f,i)=>f.classList.toggle('lit',i===n%frames.length))}
  }
  seek.value=au.duration?t/au.duration*1000:0;curT.textContent=fmt(t);
  requestAnimationFrame(tick);
}
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const seek=document.getElementById('seek'),curT=document.getElementById('cur'),durT=document.getElementById('dur'),playBtn=document.getElementById('play');
au.onloadedmetadata=()=>{durT.textContent=fmt(au.duration)};
seek.oninput=()=>{au.currentTime=seek.value/1000*au.duration;cur=-2};
playBtn.onclick=()=>au.paused?au.play():au.pause();
au.onplay=()=>playBtn.textContent='❚❚';au.onpause=()=>playBtn.textContent='▶';
addEventListener('keydown',e=>{if(e.code!=='Space')return;e.preventDefault();playBtn.click()});
requestAnimationFrame(tick);

</script>
</body>
</html>
